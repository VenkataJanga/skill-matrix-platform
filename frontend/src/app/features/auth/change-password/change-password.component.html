<div class="page-container">
  <div class="card">
    <div class="card-header">
      <h2>🔒 Change Password</h2>
      <p>Update your account password. Use at least 8 characters.</p>
    </div>

    <div class="alert alert-success" *ngIf="successMessage" role="status">
      ✅ {{ successMessage }}
    </div>
    <div class="alert alert-error" *ngIf="errorMessage" role="alert">
      ⚠️ {{ errorMessage }}
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label for="currentPassword">Current Password</label>
        <input
          id="currentPassword"
          type="password"
          formControlName="currentPassword"
          placeholder="Enter your current password"
          [class.is-invalid]="f['currentPassword'].invalid && f['currentPassword'].touched"
        />
        <div class="field-error" *ngIf="f['currentPassword'].touched && f['currentPassword'].errors?.['required']">
          Current password is required.
        </div>
      </div>

      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input
          id="newPassword"
          type="password"
          formControlName="newPassword"
          placeholder="Minimum 8 characters"
          [class.is-invalid]="f['newPassword'].invalid && f['newPassword'].touched"
        />
        <div class="field-error" *ngIf="f['newPassword'].touched && f['newPassword'].errors">
          <span *ngIf="f['newPassword'].errors?.['required']">New password is required.</span>
          <span *ngIf="f['newPassword'].errors?.['minlength']">Password must be at least 8 characters.</span>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm New Password</label>
        <input
          id="confirmPassword"
          type="password"
          formControlName="confirmPassword"
          placeholder="Re-enter your new password"
          [class.is-invalid]="
            (f['confirmPassword'].invalid && f['confirmPassword'].touched) ||
            (form.errors?.['passwordsMismatch'] && f['confirmPassword'].touched)
          "
        />
        <div class="field-error" *ngIf="f['confirmPassword'].touched">
          <span *ngIf="f['confirmPassword'].errors?.['required']">Please confirm your password.</span>
          <span *ngIf="form.errors?.['passwordsMismatch'] && !f['confirmPassword'].errors?.['required']">
            Passwords do not match.
          </span>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-secondary" (click)="cancel()" [disabled]="loading">
          Cancel
        </button>
        <button type="submit" class="btn-primary" [disabled]="loading">
          <span *ngIf="loading" class="spinner"></span>
          <span>{{ loading ? 'Updating...' : 'Update Password' }}</span>
        </button>
      </div>
    </form>
  </div>
</div>
