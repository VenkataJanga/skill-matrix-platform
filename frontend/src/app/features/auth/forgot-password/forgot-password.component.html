<div class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <span class="brand-icon">🔑</span>
      <h1>Forgot Password</h1>
      <p>Enter your username or email and we'll send you reset instructions</p>
    </div>

    <!-- Request form -->
    <form *ngIf="!submitted" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label for="usernameOrEmail">Username or Email</label>
        <input
          id="usernameOrEmail"
          type="text"
          formControlName="usernameOrEmail"
          placeholder="Enter your username or email"
          autocomplete="username"
          [class.is-invalid]="f['usernameOrEmail'].invalid && f['usernameOrEmail'].touched"
        />
        <div class="field-error" *ngIf="f['usernameOrEmail'].touched && f['usernameOrEmail'].errors">
          <span *ngIf="f['usernameOrEmail'].errors['required']">Username or email is required.</span>
        </div>
      </div>

      <button type="submit" class="btn-primary btn-full" [disabled]="loading">
        <span *ngIf="loading" class="spinner"></span>
        <span>{{ loading ? 'Sending...' : 'Send Reset Instructions' }}</span>
      </button>

      <div class="back-link">
        <a routerLink="/login">← Back to Sign In</a>
      </div>
    </form>

    <!-- Generic confirmation -->
    <div *ngIf="submitted">
      <div class="alert alert-success" role="status">
        <span class="alert-icon">✅</span>
        {{ successMessage }}
      </div>

      <div class="dev-link-box" *ngIf="devResetLink">
        <p class="dev-label">DEV MODE ONLY — reset link (never shown in production):</p>
        <a [href]="devResetLink" class="dev-link">{{ devResetLink }}</a>
      </div>

      <button type="button" class="btn-primary btn-full" (click)="backToLogin()">
        Back to Sign In
      </button>
    </div>
  </div>
</div>
