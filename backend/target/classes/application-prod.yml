# ============================================================
# Skill Matrix Platform — PROD Profile Configuration
# Usage: --spring.profiles.active=prod
# ALL values MUST come from environment variables or AWS Secrets Manager
# No hardcoded credentials — ever.
# ============================================================

spring:
  # MySQL datasource — Production RDS via environment variables
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: SkillMatrixHikariPool-Prod
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  # JPA / Hibernate — validate only, never modify schema in PROD
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

  # Flyway — validate only in PROD; migrations applied manually with DBA approval
  flyway:
    locations:
      - classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
    baseline-on-migrate: false

# ============================================================
# Server
# ============================================================
server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

# ============================================================
# Actuator — minimal in PROD; secured by Spring Security
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

# ============================================================
# Swagger — DISABLED in PROD
# ============================================================
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

# ============================================================
# Logging — WARN level in PROD; errors to CloudWatch
# ============================================================
logging:
  level:
    root: WARN
    com.skillmatrix: WARN
    org.springframework.security: WARN
    org.flywaydb: WARN
    org.hibernate.SQL: ERROR
