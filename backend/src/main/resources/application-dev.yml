# ============================================================
# Skill Matrix Platform — DEV Profile Configuration
# Usage: --spring.profiles.active=dev
# ============================================================

spring:
  # MySQL datasource — local dev
  datasource:
    url: jdbc:mysql://localhost:3306/skill_matrix_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&tinyInt1isBit=false
    username: root
    password: Nttdata@123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: SkillMatrixHikariPool-Dev
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA / Hibernate — show SQL in dev
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.MySQLDialect

  # Flyway — run all migrations + dev seeds
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
      - classpath:db/dev-migration
    clean-disabled: false

# ============================================================
# Server
# ============================================================
server:
  port: 9090
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

# ============================================================
# Actuator — expose all in dev
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      show-details: always

# ============================================================
# Swagger — enabled in dev
# ============================================================
springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

# ============================================================
# JWT — dev override (shorter expiry for testing)
# ============================================================
app:
  jwt:
    secret: "SkillMatrixPlatformDevSecretKey-NotForProduction-MustBe256BitsLongAtLeast!"
    expiration-ms: 900000          # 15 minutes
    refresh-expiration-ms: 604800000  # 7 days
  auth:
    mode: LOCAL
  frontend-base-url: "http://localhost:4200"
  password-reset:
    expiry-minutes: 20
    # DEV-ONLY: exposes the raw reset link in the API response so local
    # testing works without a configured SMTP server. NEVER set true
    # outside the 'dev' profile (also code-guarded in PasswordResetService).
    dev-expose-token: true

# ============================================================
# User Management — hard delete enabled in dev for test data cleanup
# ============================================================
user-management:
  hard-delete-enabled: true

# ============================================================
# Logging — file logging enabled for dev, DEBUG for app code
# logback-spring.xml reads LOG_PATH to set the file directory
# ============================================================
logging:
  file:
    path: logs     # resolves to backend/logs/ when running from backend/ directory
  level:
    root: INFO
    com.skillmatrix: DEBUG
    org.springframework.security: DEBUG
    org.flywaydb: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
